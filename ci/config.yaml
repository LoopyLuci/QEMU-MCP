# VM-Harness On-Device CI/CD Pipeline Configuration
# ─────────────────────────────────────────────────
# Both tracks: desktop (Python/PyQt5) and Android (Kotlin/Compose)
# Run phases sequentially with fail-fast gating.
# Use --phase to run a single phase, --track to run one track only.

version: "1.0"

# ── Global settings ──────────────────────────────────────────────────────────

global:
  # Fail-fast: stop the entire pipeline on first phase failure.
  fail_fast: true

  # Working directories
  project_root: "C:/Projects/VM-Harness"
  desktop_dir: "C:/Projects/VM-Harness"
  android_dir: "C:/Projects/VM-Harness/android"
  report_dir: "C:/Projects/VM-Harness/ci/report"
  artifact_dir: "C:/Projects/VM-Harness/ci/artifacts"

  # Timeouts (seconds)
  timeouts:
    desktop_build: 600       # PyInstaller can take a while
    android_build: 600       # Gradle build
    android_test: 300        # Unit tests
    preflight: 120           # Preflight checks

  # Artifacts to retain after pipeline
  retain:
    - "dist/VM-Harness.exe"
    - "ci/artifacts/*.apk"
    - "ci/artifacts/*.exe"
    - "ci/report/*-report.txt"

# ── Desktop track (Python / PyQt5 / VM-Harness) ────────────────────────────────

desktop:
  enabled: true
  name: "VM-Harness Desktop"
  platform: "windows"
  python: "python3"  # or full path

  # Prepare phase
  prepare:
    check_python: true
    python_version_min: "3.10"
    check_pyproject: true
    check_requirements: true
    check_qemu_binaries: true
    qemu_binaries:
      - "qemu-system-x86_64.exe"
      - "qemu-img.exe"
    check_env_file: false   # .env is user-specific, not checked in repo
    install_deps: false     # true = pip install -e . (use with caution)

  # Preflight phase
  preflight:
    import_verification: true
    gui_modules:
      - "gui.__main__"
      - "gui.main_window"
      - "gui.qmp_bridge"
      - "gui.ssh_bridge"
      - "gui.multi_vm_qmp_bridge"
      - "gui.panels"
      - "gui.panels_telemetry"
      - "gui.panels_vm_control"
      - "gui.panels_guest_terminal"
      - "gui.panels_iso"
      - "gui.panels_snapshots"
      - "gui.panels_storage"
      - "gui.panels_network"
      - "gui.panels_security"
      - "gui.panels_settings"
      - "gui.panels_logs"
      - "gui.panels_chat"
      - "gui.credential_store"
      - "gui.audit_log"
      - "gui.metrics_store"
      - "gui.vm_cloner"
      - "gui.snapshot_scheduler"
      - "gui.hot_reloader"
      - "gui.process_guardian"
      - "gui.qmp_extractor"
      - "gui.widgets"
      - "gui.multi_vm"
      - "gui.monitoring"
    check_pyproject_toml: true
    check_pyinstaller_spec: true
    check_version_consistency: true
    check_security_audit_exists: true
    check_ci_workflow_exists: true
    bare_except_check: true   # fail if bare except: found
    type_check: false         # mypy (optional, slow)

  # Test phase
  test:
    run_pytest: true
    pytest_paths:
      - "tests/test_gui.py"
      - "tests/test_audit_log.py"
      - "tests/test_e2e_qmp_ssh.py"
      - "tests/test_core.py"
      - "tests/test_integration.py"
    pytest_flags:
      - "-v"
      - "--tb=short"
      - "--color=yes"
    run_headless_validation: true
    headless_timeout: 10
    expected_passes_min: 600
    skip_if_no_display: true   # GUI mode needs display; skip on headless hosts

  # Build phase
  build:
    run_pyinstaller: true
    build_script: "scripts/build_pyinstaller.py"
    verify_exe_exists: true
    verify_exe_size_min: 5000000   # 5 MB minimum
    capture_build_output: true
    expected_qt_plugins: 48
    expected_qemu_binaries: 2

  # Deploy phase
  deploy:
    version_source: "git"         # git tag or pyproject.toml
    generate_release_notes: true
    package_artifacts: true
    artifact_name: "VM-Harness"
    include_docs: true
    include_readme: true
    include_license: true
    generate_checksums: true      # SHA256
    tag_release: false            # auto git tag (requires clean working tree)

# ── Android track (Kotlin / Jetpack Compose) ─────────────────────────────────

android:
  enabled: true
  name: "VM-Harness Android"
  platform: "android"

  # Prepare phase
  prepare:
    check_java: true
    java_version_min: "17"
    java_path: "C:/Program Files/Android/Android Studio/jbr/bin/java.exe"
    check_android_sdk: true
    android_sdk_root: "C:/Users/Server/soniccore-toolchain/sdk"
    check_gradle_wrapper: true
    check_compile_sdk: "34"
    check_min_sdk: "26"
    check_dependencies_resolve: true   # ./gradlew dependencies
    install_gradle_deps: true          # ./gradlew --refresh-dependencies

  # Preflight phase
  preflight:
    kotlin_compile_check: true        # ./gradlew compileDebugKotlin
    resource_validation: true         # ./gradlew lintDebug (or validateResources)
    manifest_validation: true         # check AndroidManifest.xml
    check_deep_link_scheme: true      # vmharness://pair
    check_min_sdk_compatibility: true
    ktlint: false                     # optional, requires ktlint setup
    check_proguard_rules: true
    check_build_gradle_consistency: true
    check_naming_conventions: true    # package name, class names

  # Test phase
  test:
    run_unit_tests: true              # ./gradlew testDebugUnitTest
    run_lint: true                    # ./gradlew lintDebug
    test_report_format: "html"       # or "xml"
    instrumented_tests: false        # requires emulator/device
    expected_pass_min: 10

  # Build phase
  build:
    build_debug_apk: true
    build_release_apk: false         # requires signing config / keystore
    release_keystore: ""             # path to .jks / .keystore
    release_alias: "vmharness-release"
    release_password_env: "ANDROID_RELEASE_KEYSTORE_PASSWORD"
    verify_apk_exists: true
    extract_apk_metadata: true       # versionName, versionCode, minSdk, targetSdk
    expected_min_sdk: 26
    expected_target_sdk: 34

  # Deploy phase
  deploy:
    output_dir: "C:/Projects/VM-Harness/ci/artifacts/android"
    copy_debug_apk: true
    copy_release_apk: false
    generate_checksums: true
    generate_apk_report: true
    version_sync_with_desktop: false  # keep Android version independent
    tag_release: false
    generate_source_archive: false     # for F-Droid (requires git archive)

# ── Shared pipeline behavior ──────────────────────────────────────────────────

pipeline:
  # Log level: debug, info, warn, error
  log_level: "info"

  # Report format: text (human-readable), json (machine-readable)
  report_format: ["text", "json"]

  # Gating: which phases gate the next
  gates:
    desktop:
      - "prepare"
      - "preflight"
      - "test"
      - "build"
    android:
      - "prepare"
      - "preflight"
      - "test"
      - "build"

  # Parallelism: run desktop and android tracks in parallel (if both enabled)
  parallel_tracks: false  # false = sequential (safer for on-device resource limits)
